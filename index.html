<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste para a Banda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h2>Se inscrevendo na GretGym 💪</h2>

    <form action="https://formspree.io/f/mrpeepzn" method="post">
      <div class="form-group">
        <label for="nome">Qual o seu nome (completo):</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Nicolas Rodrigues de Oliveira" required>
      </div>

      <div class="form-group">
        <label for="idade">Qual a sua idade:</label>
        <input type="text" id="idade"  name="idade" placeholder="Ex: 32" required>
      </div>

      <div class="form-group">
        <label for="Telefone">"Qual o seu número de telefone (com DDD)?"</label>
        <input type="number" id="telefone" name="telefone" placeholder="Ex: 12999999999" required>
      </div>

      <div class="form-group">
        <label for="CPF">"Qual o seu CPF?"</label>
        <input type="number" id="CPF" name="CPF" placeholder="Ex: 50898989800" required>
      </div>

       <div class="checklist-container">
    <label for="Sexo">Sexo:</label>

    <ul class="checklist">

        <input type="checkbox" id="Masculino" name="Masculino">
        <label for="item1">Masculino</label>

        <input type="checkbox" id="Feminino" name="Feminino">
        <label for="item2">Feminino</label>
    </ul>
  </div>
  

      <button type="submit" class="btn">Fazer minha inscrição</button>
    </form>
  </div>

</body>
</html>
